name: .NET

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      run: dotnet test --no-build --verbosity normal
      
  publish:

    runs-on: windows-latest
    
    needs: build
    if: github.ref == 'refs/heads/master'

    # Trusted publishing: nuget.org trusts this workflow file (policy: FullLifeGames / TournamentParser / dotnet.yml)
    # and exchanges GitHub's OIDC token for an API key that is valid for one hour. No API key is stored in the repository.
    permissions:
      contents: read
      id-token: write

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.x
    - name: Create Package
      run:  dotnet pack "TournamentParser.Core/TournamentParser.Core.csproj" --include-symbols -c Release
    - name: NuGet login (OIDC to temporary API key)
      uses: NuGet/login@v1
      id: login
      with:
        user: FullLifeGames # nuget.org profile name of the package owner
    - name: Push Package
      run:  dotnet nuget push "**\*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --skip-duplicate -s https://api.nuget.org/v3/index.json
